# Tests both deployment targets: Node + SQLite, and Workers + D1 + R2 (under wrangler dev, locally). ECR Public's copy
# of the Docker Official image, outside Docker Hub's anonymous pull limit.
default:
  image: public.ecr.aws/docker/library/node:24-bookworm

stages: [test]

test:
  stage: test
  cache:
    key: { files: [package-lock.json] }
    paths: [.npm/]
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run typecheck
    - npm test
