# coded-ballot on Docker. Put it behind your reverse proxy with HTTPS: passkeys need a secure origin.
# The mail password goes in a file next to this one (never in this file): smtp_pass.txt. On its first start the server
# makes a one-time setup link for the first person: docker compose exec coded-ballot setup-link
services:
  coded-ballot:
    image: coded-ballot:latest
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PUBLIC_ORIGIN: https://ballot.example.org
      PROJECT_ORIGINS: "https://sstangle73.github.io"   # the project site: its issuer page, voting page and checker
      VOTING_PAGE_URL: ""            # empty: links open this server's own /vote/ page
      SMTP_HOST: email-smtp.us-east-1.amazonaws.com
      SMTP_PORT: "587"
      SMTP_USER: ""
      SMTP_PASS_FILE: /run/secrets/smtp_pass
      MAIL_FROM: ballots@example.org
    volumes:
      - data:/data
    secrets:
      - smtp_pass
volumes:
  data:
secrets:
  smtp_pass:
    file: ./smtp_pass.txt
